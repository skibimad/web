# Apache configuration for Skibidi Madness
# Copy this to /etc/apache2/sites-available/skibidi-madness.conf

<VirtualHost *:80>
    ServerName skibidi-madness.local
    ServerAlias www.skibidi-madness.local
    
    DocumentRoot /var/www/skibidi-madness
    
    <Directory /var/www/skibidi-madness>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/skibidi-madness-error.log
    CustomLog ${APACHE_LOG_DIR}/skibidi-madness-access.log combined
</VirtualHost>

# After creating this file, enable it with:
# sudo a2ensite skibidi-madness
# sudo a2enmod rewrite
# sudo systemctl restart apache2
