<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Episodes - Skibidi Madness Admin</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <nav class="admin-nav">
        <div class="admin-nav-brand">
            <span class="logo-main">SKIBIDI</span>
            <span class="logo-sub">ADMIN PANEL</span>
        </div>
        <ul class="admin-nav-menu">
            <li><a href="admin.html">Dashboard</a></li>
            <li><a href="admin-heroes.html">Heroes</a></li>
            <li><a href="admin-episodes.html" class="active">Episodes</a></li>
            <li><a href="admin-blog.html">Blog</a></li>
            <li><a href="admin-content.html">Content Editor</a></li>
            <li><a href="index.html" target="_blank">View Site</a></li>
        </ul>
        <button id="logout-btn" class="btn-logout">Logout</button>
    </nav>

    <div class="admin-container">
        <div class="page-header">
            <h1>Manage Episodes</h1>
            <button id="add-episode-btn" class="btn btn-primary">+ Add New Episode</button>
        </div>

        <div id="episodes-list" class="items-grid"></div>
    </div>

    <!-- Episode Modal -->
    <div id="episode-modal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Add New Episode</h2>
            <form id="episode-form" class="admin-form">
                <input type="hidden" id="episode-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="episode-number">Episode Number:*</label>
                        <input type="number" id="episode-number" min="1" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="episode-title">Title:*</label>
                        <input type="text" id="episode-title" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="episode-description">Description:*</label>
                    <textarea id="episode-description" rows="4" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="episode-thumbnail">Thumbnail:*</label>
                    <div class="file-input-group">
                        <input type="text" id="episode-thumbnail" placeholder="Thumbnail path" required>
                        <input type="file" id="episode-thumbnail-file" accept="image/*" style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('episode-thumbnail-file').click()">Upload</button>
                    </div>
                    <img id="episode-thumbnail-preview" src="" alt="Preview" style="max-width: 200px; margin-top: 10px; display: none;">
                </div>
                
                <div class="form-group">
                    <label for="episode-video-url">YouTube URL:*</label>
                    <input type="url" id="episode-video-url" placeholder="https://www.youtube.com/@FireStormX!?" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="episode-duration">Duration:</label>
                        <input type="text" id="episode-duration" placeholder="e.g., 10:30">
                    </div>
                    
                    <div class="form-group">
                        <label for="episode-release-date">Release Date:</label>
                        <input type="date" id="episode-release-date">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Episode</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                if (!data.authenticated) window.location.href = '/login.html';
                else loadEpisodes();
            } catch (error) {
                window.location.href = '/login.html';
            }
        }

        let currentEpisodeId = null;

        async function loadEpisodes() {
            try {
                const response = await fetch('/api/episodes');
                const episodes = await response.json();
                
                const container = document.getElementById('episodes-list');
                container.innerHTML = episodes.map(ep => `
                    <div class="item-card">
                        <img src="${ep.thumbnail}" alt="${ep.title}" onerror="this.src='res/img/all-together.png'">
                        <h3>Episode ${ep.episode_number}: ${ep.title}</h3>
                        <p class="truncate">${ep.description}</p>
                        <div class="item-meta">
                            <span>Duration: ${ep.duration || 'N/A'}</span>
                            <span>Released: ${ep.release_date || 'N/A'}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-small" onclick="editEpisode(${ep.id})">Edit</button>
                            <button class="btn btn-small btn-danger" onclick="deleteEpisode(${ep.id}, '${ep.title}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading episodes:', error);
            }
        }

        document.getElementById('add-episode-btn').addEventListener('click', () => {
            currentEpisodeId = null;
            document.getElementById('modal-title').textContent = 'Add New Episode';
            document.getElementById('episode-form').reset();
            document.getElementById('episode-id').value = '';
            document.getElementById('episode-thumbnail-preview').style.display = 'none';
            document.getElementById('episode-modal').style.display = 'block';
        });

        async function editEpisode(id) {
            try {
                const response = await fetch('/api/episodes');
                const episodes = await response.json();
                const episode = episodes.find(e => e.id === id);
                
                if (!episode) return;
                
                currentEpisodeId = id;
                document.getElementById('modal-title').textContent = 'Edit Episode';
                document.getElementById('episode-id').value = id;
                document.getElementById('episode-number').value = episode.episode_number;
                document.getElementById('episode-title').value = episode.title;
                document.getElementById('episode-description').value = episode.description;
                document.getElementById('episode-thumbnail').value = episode.thumbnail;
                document.getElementById('episode-video-url').value = episode.video_url;
                document.getElementById('episode-duration').value = episode.duration || '';
                document.getElementById('episode-release-date').value = episode.release_date || '';
                
                const preview = document.getElementById('episode-thumbnail-preview');
                preview.src = episode.thumbnail;
                preview.style.display = 'block';
                
                document.getElementById('episode-modal').style.display = 'block';
            } catch (error) {
                console.error('Error loading episode:', error);
            }
        }

        async function deleteEpisode(id, title) {
            if (!confirm(`Delete episode "${title}"?`)) return;
            
            try {
                const response = await fetch(`/api/episodes/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadEpisodes();
                    alert('Episode deleted successfully!');
                }
            } catch (error) {
                console.error('Error deleting episode:', error);
                alert('Failed to delete episode');
            }
        }

        // File upload
        document.getElementById('episode-thumbnail-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('episode-thumbnail').value = data.path;
                    const preview = document.getElementById('episode-thumbnail-preview');
                    preview.src = data.path;
                    preview.style.display = 'block';
                }
            } catch (error) {
                console.error('Upload error:', error);
            }
        });

        // Save episode
        document.getElementById('episode-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const episodeData = {
                episode_number: parseInt(document.getElementById('episode-number').value),
                title: document.getElementById('episode-title').value,
                description: document.getElementById('episode-description').value,
                thumbnail: document.getElementById('episode-thumbnail').value,
                video_url: document.getElementById('episode-video-url').value,
                duration: document.getElementById('episode-duration').value,
                release_date: document.getElementById('episode-release-date').value
            };
            
            try {
                const url = currentEpisodeId ? `/api/episodes/${currentEpisodeId}` : '/api/episodes';
                const method = currentEpisodeId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(episodeData)
                });
                
                if (response.ok) {
                    closeModal();
                    loadEpisodes();
                    alert('Episode saved successfully!');
                }
            } catch (error) {
                console.error('Error saving episode:', error);
                alert('Failed to save episode');
            }
        });

        function closeModal() {
            document.getElementById('episode-modal').style.display = 'none';
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        checkAuth();
    </script>
</body>
</html>
