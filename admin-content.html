<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Editor - Skibidi Madness Admin</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <nav class="admin-nav">
        <div class="admin-nav-brand">
            <span class="logo-main">SKIBIDI</span>
            <span class="logo-sub">ADMIN PANEL</span>
        </div>
        <ul class="admin-nav-menu">
            <li><a href="admin.html">Dashboard</a></li>
            <li><a href="admin-heroes.html">Heroes</a></li>
            <li><a href="admin-episodes.html">Episodes</a></li>
            <li><a href="admin-blog.html">Blog</a></li>
            <li><a href="admin-content.html" class="active">Content Editor</a></li>
            <li><a href="index.html" target="_blank">View Site</a></li>
        </ul>
        <button id="logout-btn" class="btn-logout">Logout</button>
    </nav>

    <div class="admin-container">
        <h1>Static Content Editor</h1>
        <p class="subtitle">Edit landing page texts and images</p>

        <form id="content-form" class="admin-form">
            <div class="form-section">
                <h2>Hero Section</h2>
                
                <div class="form-group">
                    <label for="hero_title">Title:</label>
                    <input type="text" id="hero_title" name="hero_title" required>
                </div>
                
                <div class="form-group">
                    <label for="hero_subtitle">Subtitle:</label>
                    <input type="text" id="hero_subtitle" name="hero_subtitle" required>
                </div>
                
                <div class="form-group">
                    <label for="hero_description">Description:</label>
                    <textarea id="hero_description" name="hero_description" rows="3" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="hero_video">Background Video:</label>
                    <div class="file-input-group">
                        <input type="text" id="hero_video" name="hero_video" placeholder="Video path or URL" required>
                        <input type="file" id="hero_video_file" accept="video/*" style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('hero_video_file').click()">Upload Video</button>
                    </div>
                    <small>Current: <span id="hero_video_preview"></span></small>
                </div>
            </div>

            <div class="form-section">
                <h2>About Section</h2>
                
                <div class="form-group">
                    <label for="about_title">Title:</label>
                    <input type="text" id="about_title" name="about_title" required>
                </div>
                
                <div class="form-group">
                    <label for="about_subtitle">Subtitle:</label>
                    <input type="text" id="about_subtitle" name="about_subtitle" required>
                </div>
                
                <div class="form-group">
                    <label for="about_paragraph1">Paragraph 1:</label>
                    <textarea id="about_paragraph1" name="about_paragraph1" rows="4" required></textarea>
                    <small>HTML allowed (e.g., &lt;strong&gt;text&lt;/strong&gt;)</small>
                </div>
                
                <div class="form-group">
                    <label for="about_paragraph2">Paragraph 2:</label>
                    <textarea id="about_paragraph2" name="about_paragraph2" rows="4" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="about_paragraph3">Paragraph 3:</label>
                    <textarea id="about_paragraph3" name="about_paragraph3" rows="4" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="about_image">About Image:</label>
                    <div class="file-input-group">
                        <input type="text" id="about_image" name="about_image" placeholder="Image path or URL" required>
                        <input type="file" id="about_image_file" accept="image/*" style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('about_image_file').click()">Upload Image</button>
                    </div>
                    <div id="about_image_preview_container" style="margin-top: 10px;">
                        <img id="about_image_preview" src="" alt="Preview" style="max-width: 300px; display: none;">
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save All Changes</button>
                <button type="button" class="btn btn-secondary" onclick="loadContent()">Reset</button>
            </div>
        </form>

        <div id="save-status" class="save-status" style="display: none;"></div>
    </div>

    <script>
        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                    return;
                }
                
                loadContent();
            } catch (error) {
                window.location.href = '/login.html';
            }
        }

        // Load current content
        async function loadContent() {
            try {
                const response = await fetch('/api/content');
                const content = await response.json();
                
                // Populate form fields
                Object.keys(content).forEach(key => {
                    const field = document.getElementById(key);
                    if (field) {
                        field.value = content[key];
                        
                        // Update image preview
                        if (key === 'about_image') {
                            const preview = document.getElementById('about_image_preview');
                            preview.src = content[key];
                            preview.style.display = 'block';
                        }
                        
                        // Update video preview text
                        if (key === 'hero_video') {
                            document.getElementById('hero_video_preview').textContent = content[key];
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading content:', error);
                showStatus('Failed to load content', 'error');
            }
        }

        // Handle file uploads
        document.getElementById('hero_video_file').addEventListener('change', async (e) => {
            await uploadFile(e.target.files[0], 'hero_video');
        });

        document.getElementById('about_image_file').addEventListener('change', async (e) => {
            await uploadFile(e.target.files[0], 'about_image');
        });

        async function uploadFile(file, fieldName) {
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                showStatus('Uploading...', 'info');
                
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const field = document.getElementById(fieldName);
                    field.value = data.path;
                    
                    // Update preview
                    if (fieldName === 'about_image') {
                        const preview = document.getElementById('about_image_preview');
                        preview.src = data.path;
                        preview.style.display = 'block';
                    } else if (fieldName === 'hero_video') {
                        document.getElementById('hero_video_preview').textContent = data.path;
                    }
                    
                    showStatus('File uploaded successfully!', 'success');
                } else {
                    showStatus(data.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showStatus('Upload failed', 'error');
            }
        }

        // Save all content
        document.getElementById('content-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const updates = {};
            
            for (let [key, value] of formData.entries()) {
                updates[key] = value;
            }
            
            try {
                showStatus('Saving...', 'info');
                
                // Save each field
                const promises = Object.keys(updates).map(key => 
                    fetch(`/api/content/${key}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ value: updates[key] })
                    })
                );
                
                await Promise.all(promises);
                
                showStatus('All changes saved successfully!', 'success');
                
                // Reload content to confirm
                setTimeout(() => loadContent(), 1000);
            } catch (error) {
                console.error('Save error:', error);
                showStatus('Failed to save changes', 'error');
            }
        });

        function showStatus(message, type) {
            const statusDiv = document.getElementById('save-status');
            statusDiv.textContent = message;
            statusDiv.className = 'save-status ' + type;
            statusDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        // Initialize
        checkAuth();
    </script>
</body>
</html>
