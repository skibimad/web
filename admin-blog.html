<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Blog - Skibidi Madness Admin</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <nav class="admin-nav">
        <div class="admin-nav-brand">
            <span class="logo-main">SKIBIDI</span>
            <span class="logo-sub">ADMIN PANEL</span>
        </div>
        <ul class="admin-nav-menu">
            <li><a href="admin.html">Dashboard</a></li>
            <li><a href="admin-heroes.html">Heroes</a></li>
            <li><a href="admin-episodes.html">Episodes</a></li>
            <li><a href="admin-blog.html" class="active">Blog</a></li>
            <li><a href="admin-content.html">Content Editor</a></li>
            <li><a href="index.html" target="_blank">View Site</a></li>
        </ul>
        <button id="logout-btn" class="btn-logout">Logout</button>
    </nav>

    <div class="admin-container">
        <div class="page-header">
            <h1>Manage Blog Posts</h1>
            <button id="add-post-btn" class="btn btn-primary">+ Write New Post</button>
        </div>

        <div id="posts-list" class="items-grid"></div>
    </div>

    <!-- Blog Post Modal -->
    <div id="post-modal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Write New Post</h2>
            <form id="post-form" class="admin-form">
                <input type="hidden" id="post-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="post-title">Title:*</label>
                        <input type="text" id="post-title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="post-slug">Slug:*</label>
                        <input type="text" id="post-slug" required placeholder="e.g., my-first-post">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="post-image">Featured Image:*</label>
                    <div class="file-input-group">
                        <input type="text" id="post-image" placeholder="Image path" required>
                        <input type="file" id="post-image-file" accept="image/*" style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('post-image-file').click()">Upload</button>
                    </div>
                    <img id="post-image-preview" src="" alt="Preview" style="max-width: 200px; margin-top: 10px; display: none;">
                </div>
                
                <div class="form-group">
                    <label for="post-excerpt">Excerpt:*</label>
                    <textarea id="post-excerpt" rows="2" placeholder="Short description..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="post-content">Content:*</label>
                    <textarea id="post-content" rows="10" placeholder="Full post content (HTML allowed)..." required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="post-author">Author:</label>
                        <input type="text" id="post-author" value="FireStormX Studios">
                    </div>
                    
                    <div class="form-group">
                        <label for="post-date">Date:</label>
                        <input type="date" id="post-date">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="post-published" checked>
                        Publish this post
                    </label>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Post</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                if (!data.authenticated) window.location.href = '/login.html';
                else loadPosts();
            } catch (error) {
                window.location.href = '/login.html';
            }
        }

        let currentPostId = null;

        async function loadPosts() {
            try {
                const response = await fetch('/api/blog/all');
                const posts = await response.json();
                
                const container = document.getElementById('posts-list');
                container.innerHTML = posts.length === 0 ? 
                    '<p class="no-content">No blog posts yet. Write your first post to get started!</p>' :
                    posts.map(post => `
                        <div class="item-card">
                            <img src="${post.image}" alt="${post.title}" onerror="this.src='res/img/all-together.png'">
                            <h3>${post.title}</h3>
                            <p class="truncate">${post.excerpt}</p>
                            <div class="item-meta">
                                <span>${post.author}</span>
                                <span>${post.date || 'No date'}</span>
                                <span class="badge ${post.published ? 'badge-success' : 'badge-draft'}">${post.published ? 'Published' : 'Draft'}</span>
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-small" onclick="editPost(${post.id})">Edit</button>
                                <button class="btn btn-small btn-danger" onclick="deletePost(${post.id}, '${post.title}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }

        document.getElementById('add-post-btn').addEventListener('click', () => {
            currentPostId = null;
            document.getElementById('modal-title').textContent = 'Write New Post';
            document.getElementById('post-form').reset();
            document.getElementById('post-id').value = '';
            document.getElementById('post-author').value = 'FireStormX Studios';
            document.getElementById('post-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('post-published').checked = true;
            document.getElementById('post-image-preview').style.display = 'none';
            document.getElementById('post-modal').style.display = 'block';
        });

        async function editPost(id) {
            try {
                const response = await fetch('/api/blog/all');
                const posts = await response.json();
                const post = posts.find(p => p.id === id);
                
                if (!post) return;
                
                currentPostId = id;
                document.getElementById('modal-title').textContent = 'Edit Post';
                document.getElementById('post-id').value = id;
                document.getElementById('post-title').value = post.title;
                document.getElementById('post-slug').value = post.slug;
                document.getElementById('post-image').value = post.image;
                document.getElementById('post-excerpt').value = post.excerpt;
                document.getElementById('post-content').value = post.content;
                document.getElementById('post-author').value = post.author;
                document.getElementById('post-date').value = post.date || '';
                document.getElementById('post-published').checked = post.published === 1;
                
                const preview = document.getElementById('post-image-preview');
                preview.src = post.image;
                preview.style.display = 'block';
                
                document.getElementById('post-modal').style.display = 'block';
            } catch (error) {
                console.error('Error loading post:', error);
            }
        }

        async function deletePost(id, title) {
            if (!confirm(`Delete post "${title}"?`)) return;
            
            try {
                const response = await fetch(`/api/blog/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadPosts();
                    alert('Post deleted successfully!');
                }
            } catch (error) {
                console.error('Error deleting post:', error);
                alert('Failed to delete post');
            }
        }

        // File upload
        document.getElementById('post-image-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('post-image').value = data.path;
                    const preview = document.getElementById('post-image-preview');
                    preview.src = data.path;
                    preview.style.display = 'block';
                }
            } catch (error) {
                console.error('Upload error:', error);
            }
        });

        // Auto-generate slug from title
        document.getElementById('post-title').addEventListener('input', (e) => {
            if (!currentPostId) {  // Only auto-generate for new posts
                const slug = e.target.value
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '');
                document.getElementById('post-slug').value = slug;
            }
        });

        // Save post
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const postData = {
                title: document.getElementById('post-title').value,
                slug: document.getElementById('post-slug').value,
                image: document.getElementById('post-image').value,
                excerpt: document.getElementById('post-excerpt').value,
                content: document.getElementById('post-content').value,
                author: document.getElementById('post-author').value,
                date: document.getElementById('post-date').value,
                published: document.getElementById('post-published').checked
            };
            
            try {
                const url = currentPostId ? `/api/blog/${currentPostId}` : '/api/blog';
                const method = currentPostId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });
                
                if (response.ok) {
                    closeModal();
                    loadPosts();
                    alert('Post saved successfully!');
                }
            } catch (error) {
                console.error('Error saving post:', error);
                alert('Failed to save post');
            }
        });

        function closeModal() {
            document.getElementById('post-modal').style.display = 'none';
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        checkAuth();
    </script>
</body>
</html>
