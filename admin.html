<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Skibidi Madness</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <!-- Admin Navigation -->
    <nav class="admin-navbar">
        <div class="admin-container">
            <div class="admin-logo">
                <span class="logo-main">SKIBIDI</span>
                <span class="logo-sub">ADMIN PANEL</span>
            </div>
            <ul class="admin-menu">
                <li><a href="admin.html" class="active">Dashboard</a></li>
                <li><a href="admin-heroes.html">Heroes</a></li>
                <li><a href="admin-episodes.html">Episodes</a></li>
                <li><a href="admin-blog.html">Blog</a></li>
                <li><a href="index.html">View Site</a></li>
            </ul>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <main class="admin-main">
        <div class="admin-container">
            <h1 class="admin-title">Admin Dashboard</h1>
            
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <div class="card-icon">🦸</div>
                    <h3>Heroes</h3>
                    <p class="card-count" id="heroes-count">5</p>
                    <a href="admin-heroes.html" class="btn btn-primary">Manage Heroes</a>
                </div>

                <div class="dashboard-card">
                    <div class="card-icon">🎬</div>
                    <h3>Episodes</h3>
                    <p class="card-count" id="episodes-count">5</p>
                    <a href="admin-episodes.html" class="btn btn-primary">Manage Episodes</a>
                </div>

                <div class="dashboard-card">
                    <div class="card-icon">📝</div>
                    <h3>Blog Posts</h3>
                    <p class="card-count" id="blog-count">0</p>
                    <a href="admin-blog.html" class="btn btn-primary">Manage Blog</a>
                </div>
            </div>

            <div class="admin-section">
                <h2>Quick Actions</h2>
                <div class="quick-actions">
                    <button class="btn btn-secondary" onclick="window.location.href='admin-heroes.html'">Add New Hero</button>
                    <button class="btn btn-secondary" onclick="window.location.href='admin-episodes.html'">Add New Episode</button>
                    <button class="btn btn-secondary" onclick="window.location.href='admin-blog.html'">Write Blog Post</button>
                    <button class="btn btn-secondary" onclick="exportData()">Export Data</button>
                    <button class="btn btn-secondary" onclick="importData()">Import Data</button>
                </div>
            </div>

            <div class="admin-section">
                <h2>System Information</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <strong>Storage Used:</strong>
                        <span id="storage-used">Calculating...</span>
                    </div>
                    <div class="info-item">
                        <strong>Last Updated:</strong>
                        <span id="last-updated">-</span>
                    </div>
                    <div class="info-item">
                        <strong>Data Status:</strong>
                        <span id="data-status" class="status-ok">OK</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/admin-common.js"></script>
    <script src="scripts/admin-dashboard.js"></script>
</body>
</html>
